<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Reader</title><link rel="stylesheet" href="styles.css"><style>.reader-page{min-height:100vh;padding:130px 20px 80px;background:#f4f0e7;color:#1b1a18}.reader-shell{max-width:760px;margin:auto}.reader-shell h1{font-family:var(--serif);font-size:48px}.reader-copy{font-family:Georgia,serif;font-size:19px;line-height:2;color:#2d2a26;background:#fffdf8;padding:40px;border-radius:8px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.reader-note{font:12px 'DM Sans',sans-serif;color:#777;margin-bottom:20px}</style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWX483HZEH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MWX483HZEH');
  </script>

</head><body><main class="reader-page"><article class="reader-shell" id="readerRoot"></article></main><script src="meteorink-data.js"></script><script>const id=new URLSearchParams(location.search).get('id'),n=MeteorInkData.getNovels().find(x=>x.id===id),root=document.getElementById('readerRoot');if(!n){root.innerHTML='<h1>Chapter not found</h1><p>This novel is not available.</p>';}else{MeteorInkData.recordRead(n.id);root.innerHTML=`<p class="reader-note">METEORINK READER · ${n.genre||'NOVEL'}</p><h1>${n.title}</h1><p class="reader-note">by ${n.authorName||'Unknown Author'}${MeteorInkData.isAuthorVerified&&MeteorInkData.isAuthorVerified(n.authorId,n.authorName)?`<img class="novel-showcase-verified" src="${MeteorInkData.verificationBadgeAsset(n.authorId,n.authorName)}" alt="Verified Author" title="Verified Author">`:''}</p><div class="reader-copy">${n.description||'The author has not added chapter text yet. The reader is ready for real chapter content to be connected through the backend.'}</div>`;}</script><script src="meteorink-app.js"></script></body></html>
