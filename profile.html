<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MeteorInk — My Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .account-page{
      min-height:100vh;padding:130px 5vw 80px;
      background:linear-gradient(rgba(3,8,18,.72),rgba(3,8,18,.82)),
        url("assets/profile-background.png") center center/cover fixed no-repeat;
      position:relative;isolation:isolate;
    }
    .account-page::before{content:"";position:fixed;inset:0;background:rgba(2,7,15,.18);z-index:-1;pointer-events:none}
    .account-shell{max-width:1180px;margin:auto}
    .account-layout{display:grid;grid-template-columns:220px minmax(0,820px);gap:24px;align-items:start}
    .account-sidebar{background:rgba(7,14,25,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(231,170,49,.18);border-radius:16px;padding:12px;box-shadow:0 24px 70px rgba(0,0,0,.34);position:sticky;top:110px}
    .account-sidebar-title{padding:10px 12px 12px;color:#7f8a9b;font-size:10px;letter-spacing:.16em;font-weight:700}
    .account-sidebar-nav{display:grid;gap:4px}
    .account-sidebar-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;color:#aab4c3;text-decoration:none;font-size:12px;border:1px solid transparent;transition:.18s ease}
.account-sidebar-profile-icon{height:18px;display:grid;place-items:center;overflow:hidden;border-radius:50%}.account-sidebar-profile-icon img{width:100%;height:100%;object-fit:contain;display:block}
    .account-sidebar-link:hover{background:rgba(255,255,255,.035);color:#eef2f7}
    .account-sidebar-link.active{background:rgba(231,170,49,.09);border-color:rgba(231,170,49,.22);color:#f4d38b}
    .account-sidebar-icon{width:18px;text-align:center;font-size:13px}
    .account-main{min-width:0}
    .account-card{
      background:rgba(7,14,25,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(231,170,49,.22);border-radius:16px;padding:30px;
      box-shadow:0 24px 70px rgba(0,0,0,.4)
    }
    .account-title{font-family:var(--serif);font-size:38px;margin:0 0 5px;color:#f4f0e8}
    .account-subtitle{margin:0;color:#9da8ba;font-size:13px}
    .account-head{display:flex;align-items:center;gap:20px;padding:4px 0 26px;border-bottom:1px solid rgba(255,255,255,.08)}
    .account-avatar-wrap{position:relative;flex:0 0 auto}
    .account-avatar{
      width:104px;height:104px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
      background:radial-gradient(circle,#244463,#07101b);color:#e7aa31;font-size:32px;font-weight:800;
      border:1px solid rgba(231,170,49,.55);box-shadow:0 8px 28px rgba(0,0,0,.35)
    }
    .account-avatar img{width:100%;height:100%;object-fit:cover}
    .photo-edit{
      position:absolute;right:-3px;bottom:1px;width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(231,170,49,.65);background:#111a27;color:#f4d38b;
      display:grid;place-items:center;cursor:pointer;font-size:16px
    }
    .photo-edit:hover{background:#1a2638}
    .account-head h1{font-family:var(--serif);margin:2px 0 5px;font-size:30px}
    .account-head p{margin:0;color:#9da8ba;font-size:12px}
    .account-photo-note{margin-left:9px;color:#7f8a9b;font-size:11px}
    .account-details{display:grid;gap:12px;margin-top:24px}
    .account-row{display:flex;justify-content:space-between;gap:18px;padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.018)}
    .account-row span{color:#8793a5;font-size:11px}.account-row strong{font-size:12px;color:#eef2f7;text-align:right;overflow-wrap:anywhere}
    .account-status{min-height:18px;margin-top:13px;color:#9da8ba;font-size:11px}
    .account-status.success{color:#d8bb7b}.account-status.error{color:#ef9a9a}
    .account-gate{text-align:center;color:#9da8ba;padding:35px}
    #profilePhotoInput{display:none}
    .photo-crop-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .photo-crop-modal.open{display:flex}
    .photo-crop-dialog{width:min(94vw,520px);background:#07101b;border:1px solid rgba(231,170,49,.28);border-radius:16px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
    .photo-crop-title{margin:0 0 5px;font-family:var(--serif);font-size:24px;color:#f4f0e8}
    .photo-crop-subtitle{margin:0 0 16px;color:#9da8ba;font-size:12px}
    .photo-crop-stage{position:relative;width:min(82vw,420px);aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:10px;background:#02070f;touch-action:none;cursor:grab}
    .photo-crop-stage.dragging{cursor:grabbing}
    .photo-crop-image{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center center;pointer-events:none}
    .photo-crop-mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 0 49.5%,rgba(0,0,0,.72) 50% 100%)}
    .photo-crop-ring{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(231,170,49,.9);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.02);pointer-events:none}
    .photo-crop-controls{display:flex;align-items:center;gap:12px;margin-top:16px}
    .photo-crop-controls label{color:#9da8ba;font-size:11px;white-space:nowrap}
    .photo-crop-controls input{width:100%;accent-color:#e7aa31}
    .photo-crop-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
    .photo-crop-btn{padding:9px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#eef2f7;cursor:pointer;font-size:12px}
    .photo-crop-btn.primary{background:#e7aa31;border-color:#e7aa31;color:#07101b;font-weight:700}
    .photo-crop-btn:hover{border-color:rgba(231,170,49,.5)}
    @media(max-width:900px){
      .account-layout{grid-template-columns:1fr;gap:14px}
      .account-sidebar{position:static}
      .account-sidebar-nav{grid-template-columns:repeat(3,minmax(0,1fr))}
      .account-sidebar-link{justify-content:center}
    }
    @media(max-width:600px){
      .account-page{padding:100px 14px 60px;background-attachment:scroll}
      .account-card{padding:20px}.account-title{font-size:31px}
      .account-head{align-items:flex-start}.account-avatar{width:86px;height:86px}
      .account-head h1{font-size:26px}.account-photo-note{display:block;margin:7px 0 0}
      .account-sidebar-nav{grid-template-columns:repeat(2,minmax(0,1fr))}
      .account-row{flex-direction:column;gap:5px}.account-row strong{text-align:left}
    }
  </style>
</head>
<body>
  <main class="account-page">
    <div class="account-shell">
      <div class="account-layout">
        <aside class="account-sidebar" aria-label="Account navigation">
          <div class="account-sidebar-title">ACCOUNT</div>
          <nav class="account-sidebar-nav">
            <a class="account-sidebar-link active" href="profile.html"><span class="account-sidebar-icon account-sidebar-profile-icon"><img src="assets/my-profile-icon.png" alt=""></span><span>My Profile</span></a>
            <a class="account-sidebar-link" href="index.html#library"><span class="account-sidebar-icon">▣</span><span>My Library</span></a>
            <a class="account-sidebar-link" href="settings.html"><span class="account-sidebar-icon">⚙</span><span>Settings</span></a>
            <a class="account-sidebar-link" id="authorDashboardLink" href="author-dashboard.html" style="display:none"><span class="account-sidebar-icon">✦</span><span>Author Dashboard</span></a>
          </nav>
        </aside>
        <div class="account-main">
          <section class="account-card" id="profileCard">
            <div class="account-gate">Loading profile…</div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div class="photo-crop-modal" id="photoCropModal" aria-hidden="true">
    <div class="photo-crop-dialog" role="dialog" aria-modal="true" aria-labelledby="photoCropTitle">
      <h2 class="photo-crop-title" id="photoCropTitle">Adjust Profile Photo</h2>
      <p class="photo-crop-subtitle">Drag the photo to choose the visible area. Use the slider to zoom.</p>
      <div class="photo-crop-stage" id="photoCropStage">
        <img class="photo-crop-image" id="photoCropImage" alt="Photo crop preview">
        <div class="photo-crop-mask"></div>
        <div class="photo-crop-ring"></div>
      </div>
      <div class="photo-crop-controls">
        <label for="photoZoom">Zoom</label>
        <input id="photoZoom" type="range" min="1" max="3" step="0.01" value="1">
      </div>
      <div class="photo-crop-actions">
        <button class="photo-crop-btn" id="photoCropCancel" type="button">Cancel</button>
        <button class="photo-crop-btn primary" id="photoCropSave" type="button">Save Photo</button>
      </div>
    </div>
  </div>

  <script>
    const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const escapeAttr=(value)=>escapeHtml(value);
    let currentPicture='';

    async function loadProfile(){
      const card=document.getElementById('profileCard');
      try{
        const r=await fetch('/api/me',{credentials:'same-origin'});
        const data=await r.json();
        if(!data.authenticated||!data.user){location.href='auth.html';return;}
        const u=data.user;
        const authorDashboardLink=document.getElementById('authorDashboardLink');
        if(authorDashboardLink) authorDashboardLink.style.display=(u.role==='author')?'flex':'none';
        currentPicture=u.picture||'';
        const avatar=u.picture
          ? `<img id="profileAvatarImage" src="${escapeAttr(u.picture)}" alt="Profile picture">`
          : `<span id="profileAvatarFallback">◉</span>`;
        card.innerHTML=`
          <div class="account-head">
            <div class="account-avatar-wrap">
              <div class="account-avatar" id="accountAvatar">${avatar}</div>
              <button class="photo-edit" id="photoEditButton" type="button" aria-label="Change profile photo">✎</button>
            </div>
            <div>
              <p class="section-kicker">MY ACCOUNT</p>
              <h1>${escapeHtml(u.name||'User')} ${escapeHtml(u.surname||'')}</h1>
              <p>${escapeHtml(u.email||'')}</p>
              
              <span class="account-photo-note">JPG, PNG or WebP · max 2 MB</span>
            </div>
          </div>
          <input id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp">
          <div class="account-status" id="photoStatus"></div>
          <div class="account-details">
            <div class="account-row"><span>Account ID</span><strong>${escapeHtml(u.id||'')}</strong></div>
            <div class="account-row"><span>Account Type</span><strong>${escapeHtml(u.role||'reader')}</strong></div>
            <div class="account-row"><span>Sign-in Method</span><strong>${escapeHtml(u.authProvider||'Google')}</strong></div>
          </div>`;

        const input=document.getElementById('profilePhotoInput');
        const openPicker=()=>input.click();
        document.getElementById('photoEditButton').onclick=openPicker;
        input.onchange=handlePhotoChange;
      }catch(e){
        card.innerHTML='<div class="account-gate">Unable to load your profile.</div>';
      }
    }

    let cropState=null;

    function openCropper(file){
      const modal=document.getElementById('photoCropModal');
      const image=document.getElementById('photoCropImage');
      const stage=document.getElementById('photoCropStage');
      const zoom=document.getElementById('photoZoom');
      const reader=new FileReader();
      reader.onerror=()=>{
        const status=document.getElementById('photoStatus');
        status.className='account-status error';
        status.textContent='Unable to read the image.';
      };
      reader.onload=()=>{
        const src=reader.result;
        const img=new Image();
        img.onerror=()=>{
          const status=document.getElementById('photoStatus');
          status.className='account-status error';
          status.textContent='Invalid image file.';
        };
        img.onload=()=>{
          const stageSize=stage.clientWidth;
          const cropSize=stageSize*.70;
          const coverScale=Math.max(cropSize/img.naturalWidth,cropSize/img.naturalHeight);
          cropState={img,stageSize,cropSize,baseScale:coverScale,scale:1,x:0,y:0};
          image.src=src;
          zoom.value='1';
          updateCropPreview();
          modal.classList.add('open');
          modal.setAttribute('aria-hidden','false');
        };
        img.src=src;
      };
      reader.readAsDataURL(file);
    }

    function updateCropPreview(){
      if(!cropState) return;
      const {img,baseScale,scale,x,y}=cropState;
      const image=document.getElementById('photoCropImage');
      image.width=img.naturalWidth;
      image.height=img.naturalHeight;
      image.style.width=`${img.naturalWidth*baseScale}px`;
      image.style.height=`${img.naturalHeight*baseScale}px`;
      image.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;
    }

    function closeCropper(){
      const modal=document.getElementById('photoCropModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
      cropState=null;
    }

    function buildCroppedImage(){
      const {img,stageSize,cropSize,baseScale,scale,x,y}=cropState;
      const outputSize=512;
      const canvas=document.createElement('canvas');
      canvas.width=outputSize; canvas.height=outputSize;
      const ctx=canvas.getContext('2d');
      const displayedScale=baseScale*scale;
      const cropLeft=(stageSize-cropSize)/2;
      const cropTop=(stageSize-cropSize)/2;
      const imageLeft=(stageSize-img.naturalWidth*displayedScale)/2+x;
      const imageTop=(stageSize-img.naturalHeight*displayedScale)/2+y;
      const sx=(cropLeft-imageLeft)/displayedScale;
      const sy=(cropTop-imageTop)/displayedScale;
      const sw=cropSize/displayedScale;
      const sh=sw;
      ctx.drawImage(img,sx,sy,sw,sh,0,0,outputSize,outputSize);
      return canvas.toDataURL('image/webp',.86);
    }

    async function saveCroppedPhoto(){
      const status=document.getElementById('photoStatus');
      const saveButton=document.getElementById('photoCropSave');
      saveButton.disabled=true;
      status.className='account-status';
      status.textContent='Saving photo…';
      try{
        const dataUrl=buildCroppedImage();
        const response=await fetch('/api/profile/photo',{
          method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({picture:dataUrl})
        });
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||'Unable to save photo.');
        currentPicture=data.user?.picture||dataUrl;
        const avatar=document.getElementById('accountAvatar');
        avatar.innerHTML=`<img id="profileAvatarImage" src="${escapeAttr(currentPicture)}" alt="Profile picture">`;
        status.className='account-status success';
        status.textContent='Profile photo updated.';
        closeCropper();
      }catch(error){
        status.className='account-status error';
        status.textContent=error.message||'Unable to save photo.';
      }finally{
        saveButton.disabled=false;
        document.getElementById('profilePhotoInput').value='';
      }
    }

    async function handlePhotoChange(event){
      const file=event.target.files?.[0];
      if(!file) return;
      const status=document.getElementById('photoStatus');
      if(!/^image\/(jpeg|png|webp)$/.test(file.type)){status.className='account-status error';status.textContent='Please choose a JPG, PNG or WebP image.';event.target.value='';return;}
      if(file.size>2*1024*1024){status.className='account-status error';status.textContent='Image must be 2 MB or smaller.';event.target.value='';return;}
      try{
        openCropper(file);
      }catch(error){
        status.className='account-status error';
        status.textContent=error.message||'Unable to prepare photo.';
        event.target.value='';
      }
    }

    function initCropper(){
      const stage=document.getElementById('photoCropStage');
      const zoom=document.getElementById('photoZoom');
      let dragging=false,lastX=0,lastY=0;
      zoom.addEventListener('input',()=>{
        if(!cropState)return;
        cropState.scale=Number(zoom.value);
        const displayedScale=cropState.baseScale*cropState.scale;
        const maxX=Math.max(0,(cropState.img.naturalWidth*displayedScale-cropState.cropSize)/2);
        const maxY=Math.max(0,(cropState.img.naturalHeight*displayedScale-cropState.cropSize)/2);
        cropState.x=Math.max(-maxX,Math.min(maxX,cropState.x));
        cropState.y=Math.max(-maxY,Math.min(maxY,cropState.y));
        updateCropPreview();
      });
      const start=(x,y)=>{if(!cropState)return;dragging=true;lastX=x;lastY=y;stage.classList.add('dragging');};
      const move=(x,y)=>{
        if(!dragging||!cropState)return;
        const dx=x-lastX,dy=y-lastY;
        const displayedScale=cropState.baseScale*cropState.scale;
        const imageW=cropState.img.naturalWidth*displayedScale;
        const imageH=cropState.img.naturalHeight*displayedScale;
        const maxX=Math.max(0,(imageW-cropState.cropSize)/2);
        const maxY=Math.max(0,(imageH-cropState.cropSize)/2);
        cropState.x=Math.max(-maxX,Math.min(maxX,cropState.x+dx));
        cropState.y=Math.max(-maxY,Math.min(maxY,cropState.y+dy));
        lastX=x;lastY=y;updateCropPreview();
      };
      const stop=()=>{dragging=false;stage.classList.remove('dragging');};
      stage.addEventListener('pointerdown',e=>{stage.setPointerCapture?.(e.pointerId);start(e.clientX,e.clientY);});
      stage.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
      stage.addEventListener('pointerup',stop);
      stage.addEventListener('pointercancel',stop);
      document.getElementById('photoCropCancel').onclick=()=>{closeCropper();document.getElementById('profilePhotoInput').value='';};
      document.getElementById('photoCropSave').onclick=saveCroppedPhoto;
      document.getElementById('photoCropModal').addEventListener('click',e=>{if(e.target.id==='photoCropModal') closeCropper();});
    }

    initCropper();
    loadProfile();
  </script>
</body>
</html>
