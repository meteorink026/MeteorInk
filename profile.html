<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MeteorInk — My Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .account-page{
      min-height:100vh;padding:130px 5vw 80px;
      background:linear-gradient(rgba(3,8,18,.72),rgba(3,8,18,.82)),
        url("assets/profile-background.png") center center/cover fixed no-repeat;
      position:relative;isolation:isolate;
    }
    .account-page::before{content:"";position:fixed;inset:0;background:rgba(2,7,15,.18);z-index:-1;pointer-events:none}
    .account-shell{max-width:820px;margin:auto}
    .account-card{
      background:rgba(7,14,25,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(231,170,49,.22);border-radius:16px;padding:30px;
      box-shadow:0 24px 70px rgba(0,0,0,.4)
    }
    .account-title{font-family:var(--serif);font-size:38px;margin:0 0 5px;color:#f4f0e8}
    .account-subtitle{margin:0;color:#9da8ba;font-size:13px}
    .account-head{display:flex;align-items:center;gap:20px;padding:4px 0 26px;border-bottom:1px solid rgba(255,255,255,.08)}
    .account-avatar-wrap{position:relative;flex:0 0 auto}
    .account-avatar{
      width:104px;height:104px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
      background:radial-gradient(circle,#244463,#07101b);color:#e7aa31;font-size:32px;font-weight:800;
      border:1px solid rgba(231,170,49,.55);box-shadow:0 8px 28px rgba(0,0,0,.35)
    }
    .account-avatar img{width:100%;height:100%;object-fit:cover}
    .photo-edit{
      position:absolute;right:-3px;bottom:1px;width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(231,170,49,.65);background:#111a27;color:#f4d38b;
      display:grid;place-items:center;cursor:pointer;font-size:16px
    }
    .photo-edit:hover{background:#1a2638}
    .account-head h1{font-family:var(--serif);margin:2px 0 5px;font-size:30px}
    .account-head p{margin:0;color:#9da8ba;font-size:12px}
    .account-photo-action{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#eef2f7;cursor:pointer;font-size:12px}
    .account-photo-action:hover{border-color:rgba(231,170,49,.4)}
    .account-photo-note{margin-left:9px;color:#7f8a9b;font-size:11px}
    .account-details{display:grid;gap:12px;margin-top:24px}
    .account-row{display:flex;justify-content:space-between;gap:18px;padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.018)}
    .account-row span{color:#8793a5;font-size:11px}.account-row strong{font-size:12px;color:#eef2f7;text-align:right;overflow-wrap:anywhere}
    .account-status{min-height:18px;margin-top:13px;color:#9da8ba;font-size:11px}
    .account-status.success{color:#d8bb7b}.account-status.error{color:#ef9a9a}
    .account-gate{text-align:center;color:#9da8ba;padding:35px}
    #profilePhotoInput{display:none}

    .crop-modal{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .crop-dialog{width:min(560px,100%);background:#07101b;border:1px solid rgba(231,170,49,.3);border-radius:16px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
    .crop-dialog h2{font-family:var(--serif);font-size:28px;margin:0 0 6px;color:#f4f0e8}
    .crop-help{margin:0 0 18px;color:#9da8ba;font-size:12px}
    .crop-stage{width:min(440px,100%);aspect-ratio:1;margin:0 auto 18px;position:relative;overflow:hidden;background:#02050a;border-radius:10px;touch-action:none;cursor:grab}
    .crop-stage.dragging{cursor:grabbing}
    .crop-image{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:0 0;pointer-events:none}
    .crop-mask{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.56);border:2px solid #e7aa31}
    .crop-controls{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:#9da8ba;font-size:12px}
    .crop-controls input{flex:1;accent-color:#e7aa31}
    .crop-actions{display:flex;justify-content:flex-end;gap:10px}
    .crop-button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#eef2f7;border-radius:8px;padding:10px 15px;cursor:pointer;font-size:12px}
    .crop-button.primary{background:#e7aa31;border-color:#e7aa31;color:#08111c;font-weight:700}
    .crop-button:disabled{opacity:.55;cursor:wait}
    @media(max-width:600px){.crop-modal{padding:14px}.crop-dialog{padding:18px}.crop-dialog h2{font-size:24px}.crop-stage{width:min(92vw,440px)}}
    @media(max-width:600px){
      .account-page{padding:100px 14px 60px;background-attachment:scroll}
      .account-card{padding:20px}.account-title{font-size:31px}
      .account-head{align-items:flex-start}.account-avatar{width:86px;height:86px}
      .account-head h1{font-size:26px}.account-photo-note{display:block;margin:7px 0 0}
      .account-row{flex-direction:column;gap:5px}.account-row strong{text-align:left}
    }
  </style>
</head>
<body>
  <main class="account-page">
    <div class="account-shell">
      <section class="account-card" id="profileCard">
        <div class="account-gate">Loading profile…</div>
      </section>
    </div>
  </main>

  <script>
    const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const escapeAttr=(value)=>escapeHtml(value);
    let currentPicture='';

    async function loadProfile(){
      const card=document.getElementById('profileCard');
      try{
        const r=await fetch('/api/me',{credentials:'same-origin'});
        const data=await r.json();
        if(!data.authenticated||!data.user){location.href='auth.html';return;}
        const u=data.user;
        currentPicture=u.picture||'';
        const avatar=u.picture
          ? `<img id="profileAvatarImage" src="${escapeAttr(u.picture)}" alt="Profile picture">`
          : `<span id="profileAvatarFallback">◉</span>`;
        card.innerHTML=`
          <div class="account-head">
            <div class="account-avatar-wrap">
              <div class="account-avatar" id="accountAvatar">${avatar}</div>
              <button class="photo-edit" id="photoEditButton" type="button" aria-label="Change profile photo">✎</button>
            </div>
            <div>
              <p class="section-kicker">MY ACCOUNT</p>
              <h1>${escapeHtml(u.name||'User')} ${escapeHtml(u.surname||'')}</h1>
              <p>${escapeHtml(u.email||'')}</p>
              
              <span class="account-photo-note">JPG, PNG or WebP · max 2 MB</span>
            </div>
          </div>
          <input id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp">
          <div class="account-status" id="photoStatus"></div>
          <div class="account-details">
            <div class="account-row"><span>Account ID</span><strong>${escapeHtml(u.id||'')}</strong></div>
            <div class="account-row"><span>Account Type</span><strong>${escapeHtml(u.role||'reader')}</strong></div>
            <div class="account-row"><span>Sign-in Method</span><strong>${escapeHtml(u.authProvider||'Google')}</strong></div>
          </div>`;

        const input=document.getElementById('profilePhotoInput');
        const openPicker=()=>input.click();
        document.getElementById('photoEditButton').onclick=openPicker;
        input.onchange=handlePhotoChange;
      }catch(e){
        card.innerHTML='<div class="account-gate">Unable to load your profile.</div>';
      }
    }

    async function handlePhotoChange(event){
      const file=event.target.files?.[0];
      if(!file) return;
      const status=document.getElementById('photoStatus');
      if(!/^image\/(jpeg|png|webp)$/.test(file.type)){status.className='account-status error';status.textContent='Please choose a JPG, PNG or WebP image.';event.target.value='';return;}
      if(file.size>2*1024*1024){status.className='account-status error';status.textContent='Image must be 2 MB or smaller.';event.target.value='';return;}
      try{
        await openCropper(file);
      }catch(error){
        status.className='account-status error';
        status.textContent=error.message||'Unable to open the photo editor.';
      }finally{
        event.target.value='';
      }
    }

    function openCropper(file){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onerror=()=>reject(new Error('Unable to read the image.'));
        reader.onload=()=>{
          const img=new Image();
          img.onerror=()=>reject(new Error('Invalid image file.'));
          img.onload=()=>showCropper(img,resolve,reject);
          img.src=reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function showCropper(img,resolve,reject){
      const old=document.getElementById('cropModal');
      if(old) old.remove();
      const modal=document.createElement('div');
      modal.className='crop-modal';
      modal.id='cropModal';
      modal.innerHTML=`
        <div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropTitle">
          <h2 id="cropTitle">Adjust Profile Photo</h2>
          <p class="crop-help">Drag the photo to choose the visible area. Use the slider to zoom.</p>
          <div class="crop-stage" id="cropStage">
            <img class="crop-image" id="cropImage" alt="Photo preview">
            <div class="crop-mask" aria-hidden="true"></div>
          </div>
          <label class="crop-controls">Zoom <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></label>
          <div class="crop-actions">
            <button class="crop-button" id="cropCancel" type="button">Cancel</button>
            <button class="crop-button primary" id="cropSave" type="button">Save Photo</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      const stage=document.getElementById('cropStage');
      const image=document.getElementById('cropImage');
      const zoom=document.getElementById('cropZoom');
      const cancel=document.getElementById('cropCancel');
      const save=document.getElementById('cropSave');
      image.src=img.src;

      let stageSize=0, baseScale=1, scale=1, x=0, y=0, startX=0, startY=0, startImgX=0, startImgY=0, dragging=false;
      const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
      const bounds=()=>{
        const w=img.naturalWidth*scale, h=img.naturalHeight*scale;
        return {minX:stageSize-w,maxX:0,minY:stageSize-h,maxY:0};
      };
      const render=()=>{
        image.style.width=img.naturalWidth*scale+'px';
        image.style.height=img.naturalHeight*scale+'px';
        image.style.left=x+'px';
        image.style.top=y+'px';
      };
      const fit=()=>{
        stageSize=stage.clientWidth;
        baseScale=Math.max(stageSize/img.naturalWidth,stageSize/img.naturalHeight);
        scale=baseScale;
        const b=bounds();
        x=(b.minX+b.maxX)/2;
        y=(b.minY+b.maxY)/2;
        render();
      };
      requestAnimationFrame(fit);

      zoom.oninput=()=>{
        const oldScale=scale;
        const factor=Number(zoom.value);
        scale=baseScale*factor;
        const center=stageSize/2;
        const ratio=scale/oldScale;
        x=center-(center-x)*ratio;
        y=center-(center-y)*ratio;
        const b=bounds();
        x=clamp(x,b.minX,b.maxX); y=clamp(y,b.minY,b.maxY);
        render();
      };
      const pointerDown=e=>{dragging=true;stage.classList.add('dragging');startX=e.clientX;startY=e.clientY;startImgX=x;startImgY=y;stage.setPointerCapture?.(e.pointerId);};
      const pointerMove=e=>{if(!dragging)return;const b=bounds();x=clamp(startImgX+e.clientX-startX,b.minX,b.maxX);y=clamp(startImgY+e.clientY-startY,b.minY,b.maxY);render();};
      const pointerUp=()=>{dragging=false;stage.classList.remove('dragging');};
      stage.addEventListener('pointerdown',pointerDown);stage.addEventListener('pointermove',pointerMove);stage.addEventListener('pointerup',pointerUp);stage.addEventListener('pointercancel',pointerUp);
      cancel.onclick=()=>{modal.remove();resolve();};
      modal.addEventListener('click',e=>{if(e.target===modal){modal.remove();resolve();}});
      save.onclick=()=>{
        save.disabled=true;save.textContent='Saving…';
        try{
          const output=512;
          const sourceScale=scale;
          const sx=Math.max(0,Math.min(img.naturalWidth-stageSize/sourceScale,(-x)/sourceScale));
          const sy=Math.max(0,Math.min(img.naturalHeight-stageSize/sourceScale,(-y)/sourceScale));
          const sw=Math.min(img.naturalWidth-sx,stageSize/sourceScale);
          const sh=Math.min(img.naturalHeight-sy,stageSize/sourceScale);
          const side=Math.min(sw,sh);
          const canvas=document.createElement('canvas');canvas.width=output;canvas.height=output;
          const ctx=canvas.getContext('2d');ctx.drawImage(img,sx,sy,side,side,0,0,output,output);
          const dataUrl=canvas.toDataURL('image/webp',.84);
          modal.remove();
          saveProfilePhoto(dataUrl).then(resolve).catch(reject);
        }catch(error){save.disabled=false;save.textContent='Save Photo';reject(error);}
      };
      window.addEventListener('resize',fit,{once:true});
    }

    async function saveProfilePhoto(dataUrl){
      const status=document.getElementById('photoStatus');
      status.className='account-status';status.textContent='Saving photo…';
      const response=await fetch('/api/profile/photo',{
        method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({picture:dataUrl})
      });
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||'Unable to save photo.');
      currentPicture=data.user?.picture||dataUrl;
      const avatar=document.getElementById('accountAvatar');
      avatar.innerHTML=`<img id="profileAvatarImage" src="${escapeAttr(currentPicture)}" alt="Profile picture">`;
      status.className='account-status success';status.textContent='Profile photo updated.';
    }

    loadProfile();
  </script>
</body>
</html>
