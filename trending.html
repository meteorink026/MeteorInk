<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeteorInk — Trending Novels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .trending-page{
      min-height:100vh;
      padding:130px 5vw 70px;
      background:
        linear-gradient(180deg,rgba(3,7,17,.48),rgba(3,7,17,.82)),
        url("assets/trending-background.png") center center/cover fixed no-repeat;
    }
    .trending-page-head{max-width:1100px;margin:0 auto 28px}
    .trending-page-head h1{font-family:var(--serif);font-size:56px;line-height:1;margin:8px 0 12px}
    .trending-page-head p{color:#9faabd;max-width:680px}
    .trending-page-tabs{display:flex;gap:8px;margin-top:24px}
    .trending-page-tabs button{min-height:38px;padding:0 18px;border:1px solid rgba(231,170,49,.25);border-radius:20px;background:rgba(4,10,20,.55);color:#9ba5b6;cursor:pointer}
    .trending-page-tabs button.active{color:#171109;background:linear-gradient(135deg,#ffd05a,#c98c18);border-color:#eab23d;font-weight:700}
    .trending-page-empty{max-width:1100px;min-height:390px;margin:auto;border:1px dashed rgba(231,170,49,.28);border-radius:13px;display:grid;place-items:center;text-align:center;padding:35px;background:rgba(5,11,22,.65)}
    .trending-page-empty-inner{max-width:560px}
    .trending-page-empty .star{font-size:34px;color:var(--gold2);margin-bottom:12px}
    .trending-page-empty h2{font-family:var(--serif);font-size:32px;margin-bottom:8px}
    .trending-page-empty p{color:#9faabd}.asset-pagination-wrap{width:100%;margin-top:20px}.asset-pagination{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:20px auto 4px}.asset-pagination button{min-width:40px;height:40px;padding:0 12px;border:1px solid rgba(231,170,49,.22);border-radius:9px;background:rgba(5,12,22,.82);color:#cfd7e2;font-weight:700;cursor:pointer}.asset-pagination button.active{background:#e7aa31;border-color:#e7aa31;color:#090d14}.asset-pagination button:disabled{opacity:.45;cursor:not-allowed}.asset-pagination span{color:#8b98aa;font-size:12px;margin:0 6px}
    .trending-back{display:inline-block;margin-top:22px;color:var(--gold2)}
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWX483HZEH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MWX483HZEH');
  </script>

</head>
<body><main class="trending-page"><div class="trending-page-head"><p class="section-kicker">DISCOVER</p><h1>Trending Novels</h1><p>Explore the most viewed novels across MeteorInk, ranked by real view activity in the selected period.</p><div class="trending-page-tabs" role="tablist"><button class="active" data-period="today">Today</button><button data-period="7days">7 Days</button><button data-period="month">1 Month</button></div></div><section id="trendingResults" class="dynamic-content-grid" style="max-width:1100px;margin:0 auto"></section></main><script src="meteorink-data.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=(period)=>{const all=MeteorInkData.trending(period),perPage=12;let page=Number(window.__trendingPage||1),totalPages=Math.max(1,Math.ceil(all.length/perPage));page=Math.min(page,totalPages);window.__trendingPage=page;const items=all.slice((page-1)*perPage,page*perPage),host=document.getElementById('trendingResults');if(!all.length){host.innerHTML=`<section class="trending-page-empty"><div class="trending-page-empty-inner"><div class="star">✦</div><h2>No trending novels yet.</h2><p>Once readers start viewing stories, the most viewed novels from the selected period will appear here automatically.</p></div></section>`;return;}host.innerHTML=items.map(n=>`<article class="dynamic-story-card" data-id="${esc(n.id)}"><div class="dynamic-cover">${n.cover?`<img src="${esc(n.cover)}" alt="">`:'✦'}</div><div class="dynamic-card-body"><p class="dynamic-type">${esc(n.genre||'NOVEL')}</p><h3>${esc(n.title)}</h3><p>${esc(n.authorName||'Unknown Author')}</p><small>${Number(n.rankingViews||0).toLocaleString()} views in selected period</small></div></article>`).join('');let pg=document.getElementById('trendingPagination');pg?.remove();if(totalPages>1){pg=document.createElement('div');pg.id='trendingPagination';pg.className='asset-pagination-wrap';let h='<nav class="asset-pagination"><button data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>Previous</button>';for(let i=Math.max(1,Math.min(page-3,totalPages-6));i<=Math.min(totalPages,Math.max(1,Math.min(page-3,totalPages-6))+6);i++)h+='<button data-page="'+i+'" class="'+(i===page?'active':'')+'">'+i+'</button>';h+='<span>Page '+page+' of '+totalPages+'</span><button data-page="'+(page+1)+'" '+(page===totalPages?'disabled':'')+'>Next</button></nav>';pg.innerHTML=h;host.parentNode.insertBefore(pg,host.nextSibling);pg.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;window.__trendingPage=Number(b.dataset.page);render(period);window.scrollTo({top:0,behavior:'smooth'});}));}host.querySelectorAll('.dynamic-story-card').forEach(c=>c.addEventListener('click',()=>{MeteorInkData.recordView(c.dataset.id);location.href='novel.html?id='+encodeURIComponent(c.dataset.id)}));};document.querySelectorAll('.trending-page-tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.trending-page-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.__trendingPage=1;render(b.dataset.period)}));render('today');</script><script src="meteorink-app.js"></script></body></html>
