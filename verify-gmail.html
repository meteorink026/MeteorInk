<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Verify Gmail</title><link rel="stylesheet" href="styles.css"></head><body><main class="flow-page"><section class="flow-card"><p class="section-kicker">VERIFY</p><h1>Verify your Gmail</h1><p>Enter the 6-digit OTP sent to your Gmail ID to complete account verification.</p><p id="verifyTarget" class="auth-note"></p><form id="verifyForm"><label>OTP <span class="required">*</span></label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button type="submit" class="gold-btn">Verify Gmail</button></form><p id="verifyError" class="auth-error" hidden></p><p class="auth-note">Production note: connect this screen to an email provider for real OTP delivery. This browser build uses a development verification adapter.</p><p class="auth-switch"><a href="signup.html">← Back to Sign Up</a></p></section></main><script src="meteorink-data.js"></script><script>
const pending=JSON.parse(localStorage.getItem('meteorink_pending_signup')||'null');document.getElementById('verifyTarget').textContent=pending?`Verification target: ${pending.email}`:'No pending signup found.';const demoOtp='000000';
document.getElementById('verifyForm').addEventListener('submit',e=>{e.preventDefault();const err=document.getElementById('verifyError'),otp=document.getElementById('otp').value.trim();if(!pending){err.textContent='Your signup session has expired. Please start again.';err.hidden=false;return;}if(otp!==demoOtp){err.textContent='Invalid OTP for this development build. Use 000000 until a real mail provider is connected.';err.hidden=false;return;}const user={id:crypto.randomUUID(),name:pending.name,surname:pending.surname,email:pending.email,dob:pending.dob,passwordHash:pending.passwordHash,createdAt:pending.createdAt,verified:true};MeteorInkData.saveUser(user);MeteorInkData.setSession(user);localStorage.setItem('meteorink_logged_in','true');localStorage.removeItem('meteorink_pending_signup');location.href='author-setup.html';});
</script><script src="meteorink-app.js"></script></body></html>
