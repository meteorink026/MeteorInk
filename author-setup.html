<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Become an Author</title><link rel="stylesheet" href="styles.css">

</head><body><main class="flow-page"><section class="flow-card"><p class="section-kicker">WRITERS</p><h1>Become an Author</h1><p>Set up your author profile before you start publishing.</p><form id="authorForm"><label>Author Name</label><input id="authorName" required><label>Author Bio</label><textarea id="authorBio" rows="4"></textarea><button type="submit" class="gold-btn">Create Author Profile</button></form></section></main><script src="meteorink-data.js"></script><script>document.getElementById('authorForm').addEventListener('submit',e=>{e.preventDefault();const u=MeteorInkData.getSession();if(!u){location.href='auth.html?next=writer';return;}const author={id:'author-'+u.id,userId:u.id,name:document.getElementById('authorName').value.trim(),bio:document.getElementById('authorBio').value.trim(),followers:0,profileCreatedAt:new Date().toISOString()};MeteorInkData.saveAuthor(author);localStorage.setItem('meteorink_author_established','true');localStorage.setItem('meteorink_author_name',author.name);localStorage.setItem('meteorink_author_id',author.id);location.href='author-dashboard.html';});</script><script src="meteorink-app.js"></script></body></html>
