<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MeteorInk — Become an Author</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .author-setup-page{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:stretch;
      justify-content:flex-end;
      background:#030711 url("assets/author-setup-background.png") center center / cover no-repeat;
    }
    .author-setup-vignette{
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,rgba(2,5,10,.02) 0%,rgba(2,5,10,.08) 48%,rgba(2,5,10,.38) 72%,rgba(2,5,10,.68) 100%),linear-gradient(180deg,rgba(1,5,12,.08),rgba(1,5,12,.28));
      pointer-events:none;
    }
    .author-setup-shell{
      position:relative;
      z-index:2;
      width:min(560px,46vw);
      min-height:100vh;
      padding:58px clamp(24px,4vw,70px) 58px clamp(24px,3vw,50px);
      display:flex;
      align-items:center;
    }
    .author-setup-card{
      width:100%;
      padding:34px 34px 30px;
      border:1px solid rgba(231,170,49,.42);
      border-radius:16px;
      background:rgba(4,10,20,.82);
      backdrop-filter:blur(12px);
      box-shadow:0 24px 80px rgba(0,0,0,.48),inset 0 0 35px rgba(231,170,49,.035);
    }
    .author-setup-card h1{font-family:var(--serif);font-size:46px;line-height:1.05;margin:7px 0 8px}
    .author-setup-intro{color:#aeb8ca;margin-bottom:24px}
    .author-setup-form{display:grid;gap:9px}
    .author-setup-form label{font-size:13px;color:#d8dde7;margin-top:5px}
    .author-setup-form input,.author-setup-form textarea{
      width:100%;
      border:1px solid rgba(231,170,49,.28);
      border-radius:8px;
      background:rgba(5,12,23,.88);
      color:#f7f4ed;
      padding:12px 13px;
      outline:none;
      transition:border-color .2s ease,box-shadow .2s ease;
    }
    .author-setup-form input:focus,.author-setup-form textarea:focus{
      border-color:rgba(255,214,106,.72);
      box-shadow:0 0 0 3px rgba(231,170,49,.08);
    }
    .author-setup-form textarea{resize:vertical;min-height:112px}
    .private-note{font-size:11px;color:#8e99ac;margin-top:-4px;margin-bottom:3px}
    .author-setup-error{color:#ffb0a8;font-size:12px;padding:10px 12px;border:1px solid rgba(255,112,95,.28);border-radius:7px;background:rgba(100,20,15,.16)}
    .author-setup-success{color:#d8f1c0;font-size:12px}
    .author-setup-submit{width:100%;margin-top:8px}
    @media(max-width:900px){
      .author-setup-page{background-position:center center}
      .author-setup-vignette{background:linear-gradient(90deg,rgba(2,5,10,.38),rgba(2,5,10,.76)),linear-gradient(180deg,rgba(1,5,12,.12),rgba(1,5,12,.35))}
      .author-setup-shell{width:min(620px,100%);margin-left:auto}
    }
    @media(max-width:620px){
      .author-setup-page{background-position:center center}
      .author-setup-vignette{background:linear-gradient(90deg,rgba(2,5,10,.58),rgba(2,5,10,.82))}
      .author-setup-shell{padding:26px 16px;align-items:center}
      .author-setup-card{padding:27px 21px 24px;border-radius:13px;background:rgba(4,10,20,.87)}
      .author-setup-card h1{font-size:38px}
    }
  </style>
</head>
<body class="auth-no-global-nav">
  <main class="author-setup-page">
    <div class="author-setup-vignette" aria-hidden="true"></div>
    <section class="author-setup-shell">
      <div class="author-setup-card">
        <p class="section-kicker">WRITERS</p>
        <h1>Become an Author</h1>
        <p class="author-setup-intro">Create your MeteorInk author profile. Your real name and date of birth stay private.</p>
        <form id="authorForm" class="author-setup-form">
          <label for="authorRealName">Author Real Name</label>
          <input id="authorRealName" type="text" autocomplete="name" required>
          <p class="private-note">Private. This will not be displayed on your public author profile.</p>

          <label for="authorDob">Author's DOB</label>
          <input id="authorDob" type="date" autocomplete="bday" required>
          <p class="private-note">Private. Used for account/age verification and stored server-side.</p>

          <label for="authorPenName">Pen Name</label>
          <input id="authorPenName" type="text" autocomplete="nickname" maxlength="80" required>

          <label for="authorBio">Author's Bio</label>
          <textarea id="authorBio" rows="5" maxlength="1200" placeholder="Tell readers about yourself as a writer..."></textarea>

          <p id="authorError" class="author-setup-error" hidden></p>
          <button type="submit" class="gold-btn author-setup-submit" id="authorSubmit">Create Author Profile</button>
        </form>
      </div>
    </section>
  </main>
  <script src="meteorink-data.js"></script>
  <script>
  (async function(){
    const form=document.getElementById('authorForm');
    const error=document.getElementById('authorError');
    const submit=document.getElementById('authorSubmit');
    const realName=document.getElementById('authorRealName');
    const dob=document.getElementById('authorDob');
    const penName=document.getElementById('authorPenName');
    const bio=document.getElementById('authorBio');

    const today=new Date();
    dob.max=new Date(today.getFullYear(),today.getMonth(),today.getDate()).toISOString().slice(0,10);

    try{
      const me=await fetch('/api/me',{credentials:'same-origin'});
      const data=await me.json();
      if(!data.authenticated){location.href='auth.html?next=writer';return;}
    }catch(_e){
      error.textContent='Please open MeteorInk through its server, not directly as a file.';
      error.hidden=false;
      return;
    }

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      error.hidden=true;
      submit.disabled=true;
      submit.textContent='Creating Profile...';
      try{
        const response=await fetch('/api/author/setup',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body:JSON.stringify({
            realName:realName.value.trim(),
            dob:dob.value,
            penName:penName.value.trim(),
            bio:bio.value.trim()
          })
        });
        const out=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(out.error||'Could not create the author profile.');

        // Only the public author profile is cached in the browser.
        // Real name and DOB are intentionally never written to localStorage.
        if(window.MeteorInkData?.saveAuthor && out.author) MeteorInkData.saveAuthor(out.author);
        if(out.author){
          localStorage.setItem('meteorink_author_established','true');
          localStorage.setItem('meteorink_author_name',out.author.name||'');
          localStorage.setItem('meteorink_author_id',out.author.id||'');
        }
        location.href='author-dashboard.html';
      }catch(err){
        error.textContent=err.message||'Could not create the author profile.';
        error.hidden=false;
        submit.disabled=false;
        submit.textContent='Create Author Profile';
      }
    });
  })();
  </script>
  <script src="meteorink-app.js"></script>
</body>
</html>
