<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Author Dashboard</title><link rel="stylesheet" href="styles.css"><style>.dashboard-page{min-height:100vh;padding:125px 5vw 70px;background:#030711}.dashboard-shell{max-width:1100px;margin:auto}.dash-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:20px}.dash-panel{background:rgba(7,14,25,.88);border:1px solid rgba(231,170,49,.2);border-radius:14px;padding:24px}.dash-panel h1,.dash-panel h2{font-family:var(--serif);margin-top:0}.dash-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.dash-stat div{padding:14px;background:rgba(255,255,255,.035);border-radius:10px}.dash-stat strong{display:block;font-size:22px;color:#e7aa31}.dash-stat span{font-size:10px;color:#8f9bad}.published-list{display:grid;gap:10px;margin-top:15px}.published-item{padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:9px}.published-item h3{margin:0 0 5px;font-size:15px}.published-item p{margin:0;color:#9ca8ba;font-size:11px}@media(max-width:850px){.dash-grid{grid-template-columns:1fr}.dash-stat{grid-template-columns:1fr 1fr}}</style></head><body><main class="dashboard-page"><div class="dashboard-shell"><div class="section-kicker">WRITER SPACE</div><div class="dash-grid"><section class="dash-panel"><h1 id="welcome">Author Dashboard</h1><p class="auth-note">Manage your author identity and publish novels. Published stories automatically feed Latest Arrivals, Search and ranking systems.</p><div class="dash-stat"><div><strong id="followerCount">0</strong><span>Followers</span></div><div><strong id="novelCount">0</strong><span>Novels</span></div><div><strong id="viewCount">0</strong><span>Total Views</span></div></div><a class="gold-btn" href="index.html">Back to Home</a></section><section class="dash-panel"><h2>Publish a Novel</h2><form id="publishNovelForm"><label>Novel Title</label><input id="novelTitle" required><label>Genre</label><input id="novelGenre" required><label>Description</label><textarea id="novelDescription" rows="5"></textarea><label>Cover Image URL <span class="optional">(optional)</span></label><input id="novelCover" placeholder="assets/your-cover.jpg"><button type="submit" class="gold-btn">Publish Novel</button></form><p id="publishStatus" class="auth-note"></p></section></div><section class="dash-panel" style="margin-top:20px"><h2>Your Published Novels</h2><div id="publishedList" class="published-list"></div></section></div></main><script src="meteorink-data.js"></script><script>
const session=MeteorInkData.getSession();if(!session){location.href='auth.html?next=writer';}
const author=MeteorInkData.getAuthors().find(a=>a.userId===session?.id||a.id===localStorage.getItem('meteorink_author_id'));if(!author){location.href='author-setup.html';}
const novels=()=>MeteorInkData.getNovels().filter(n=>n.authorId===author.id);
document.getElementById('welcome').textContent=`Welcome, ${author.name}`;function render(){const ns=novels();document.getElementById('followerCount').textContent=Number(author.followers||0).toLocaleString();document.getElementById('novelCount').textContent=ns.length;document.getElementById('viewCount').textContent=ns.reduce((s,n)=>s+Number(n.views||0),0).toLocaleString();document.getElementById('publishedList').innerHTML=ns.length?ns.slice().reverse().map(n=>`<article class="published-item"><h3>${n.title}</h3><p>${n.genre} · ${Number(n.views||0).toLocaleString()} views · ${new Date(n.publishedAt).toLocaleDateString()}</p></article>`).join(''):'<p class="auth-note">No novels published yet.</p>';}render();
document.getElementById('publishNovelForm').addEventListener('submit',e=>{e.preventDefault();MeteorInkData.publishNovel({title:document.getElementById('novelTitle').value.trim(),genre:document.getElementById('novelGenre').value.trim(),description:document.getElementById('novelDescription').value.trim(),cover:document.getElementById('novelCover').value.trim(),authorId:author.id,authorName:author.name});document.getElementById('publishStatus').textContent='Published. Homepage sections will update automatically.';e.target.reset();render();});
</script><script src="meteorink-app.js"></script></body></html>
