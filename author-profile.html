<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Author</title><link rel="stylesheet" href="styles.css"><style>.profile-page{min-height:100vh;padding:130px 5vw 80px;background:#030711}.profile-shell{max-width:1050px;margin:auto}.profile-head{display:flex;gap:18px;align-items:center;background:rgba(7,14,25,.88);padding:25px;border:1px solid rgba(231,170,49,.2);border-radius:14px}.profile-avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#244463,#07101b);color:#e7aa31;font-size:32px;font-weight:900}.profile-head h1{font-family:var(--serif);margin:0 0 5px;font-size:42px}.profile-head p{margin:0;color:#9faabd}.profile-books{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:800px){.profile-books{grid-template-columns:1fr 1fr}}@media(max-width:550px){.profile-books{grid-template-columns:1fr}.profile-head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="profile-page"><div class="profile-shell" id="profileRoot"></div></main><script src="meteorink-data.js"></script><script>const id=new URLSearchParams(location.search).get('id'),a=(MeteorInkData.getCatalogAuthors?MeteorInkData.getCatalogAuthors():MeteorInkData.getAuthors()).find(x=>x.id===id),root=document.getElementById('profileRoot');if(!a){root.innerHTML='<section class="flow-card"><h1>Author not found</h1><a class="gold-btn" href="authors.html">Back to Authors</a></section>';}else{const ns=(MeteorInkData.getCatalogNovels?MeteorInkData.getCatalogNovels():MeteorInkData.getNovels()).filter(n=>n.authorId===a.id);root.innerHTML=`<section class="profile-head"><div class="profile-avatar">${(a.name||'?').charAt(0).toUpperCase()}</div><div><h1>${a.name}${MeteorInkData.isAuthorVerified&&MeteorInkData.isAuthorVerified(a.id,a.name)?`<img class="author-verified-badge" src="${MeteorInkData.verificationBadgeAsset(a.id,a.name)}" alt="Verified Author" title="Verified Author">`:''}</h1><p>${Number(a.followers||0).toLocaleString()} followers</p><p>${a.bio||'MeteorInk author.'}</p></div></section><section class="profile-books">${ns.length?ns.map(n=>`<a class="dynamic-story-card" href="novel.html?id=${encodeURIComponent(n.id)}"><div class="dynamic-cover">${n.cover?`<img src="${n.cover}" alt="">`:'✦'}</div><div class="dynamic-card-body"><h3>${n.title}</h3><p>${Number(n.views||0).toLocaleString()} views</p></div></a>`).join(''):'<section class="flow-card"><h2>No novels yet.</h2></section>'}</section>`;}</script><script src="meteorink-app.js"></script></body></html>
