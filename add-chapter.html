<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/meteorink-favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Write and publish a chapter on MeteorInk.">
  <title>MeteorInk — Add Chapter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700;800&family=Comic+Neue:wght@400;700&family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700;900&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--mi-gold:#e7aa31;--mi-bg:#030711;--mi-panel:#07101d;--mi-border:rgba(231,170,49,.2);--mi-muted:#8ea0b8;--mi-text:#eef3f8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--mi-bg);color:var(--mi-text);font-family:"DM Sans",Arial,sans-serif}
    .chapter-page{min-height:100vh;padding:118px 5vw 70px;position:relative;overflow:clip;background:radial-gradient(circle at 80% 15%,rgba(231,170,49,.08),transparent 26%),radial-gradient(circle at 12% 80%,rgba(64,102,145,.09),transparent 30%),#030711}
    .chapter-page:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,7,17,.08),rgba(3,7,17,.72))}
    .chapter-shell{max-width:1180px;margin:0 auto;position:relative;z-index:1}
    .chapter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .chapter-kicker{margin:0 0 8px;color:var(--mi-gold);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .chapter-top h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1.08;color:#f3eee4}
    .chapter-subtitle{margin:8px 0 0;color:#91a1b5;font-size:13px;line-height:1.6}
    .chapter-back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#aeb9c8;background:rgba(7,14,25,.78);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
    .chapter-back:hover{border-color:rgba(231,170,49,.45);color:#f5c34a}
    .chapter-panel{background:rgba(7,14,25,.94);border:1px solid var(--mi-border);border-radius:16px;padding:26px;box-shadow:0 18px 55px rgba(0,0,0,.22)}
    .chapter-meta{display:grid;grid-template-columns:170px 1fr;gap:16px;margin-bottom:18px}
    .field label{display:block;margin:0 0 7px;color:#dce4ef;font-size:12px;font-weight:800}
    .field input{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.11);border-radius:9px;background:#091321;color:#eef3f8;padding:0 13px;font:15px/1.4 "DM Sans",sans-serif;outline:none}
    .field input:focus{border-color:rgba(231,170,49,.65);box-shadow:0 0 0 3px rgba(231,170,49,.08)}
    .field-help{margin:6px 0 0;color:#718198;font-size:11px}
    .editor-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
    .editor-label label{margin:0;color:#dce4ef;font-size:12px;font-weight:800}
    .counts{color:#718198;font-size:11px}
    .editor{border:1px solid rgba(231,170,49,.18);border-radius:11px;overflow:visible;background:#07101d;color:#eef3f8;box-shadow:0 8px 25px rgba(0,0,0,.22)}
    .toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:9px;border:1px solid rgba(231,170,49,.18);border-bottom-color:rgba(231,170,49,.22);border-radius:11px 11px 0 0;background:#091523;position:sticky;top:92px;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.28)}
    .tool,.toolbar select{height:34px;border:1px solid rgba(255,255,255,.13);border-radius:6px;background:#101d2c;color:#e9eef5;font:700 12px/1 "DM Sans",Arial,sans-serif;cursor:pointer}
    .tool{min-width:34px;padding:0 9px}
    .tool:hover,.toolbar select:hover{background:#17283a;border-color:rgba(231,170,49,.45)}
    .tool.active{background:#1b2b3d;border-color:rgba(231,170,49,.65);color:#f5c34a}
    .toolbar select{padding:0 7px;font-weight:600}
    .toolbar .separator{width:1px;height:22px;background:rgba(255,255,255,.13);margin:0 3px}
    .color-tool{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 8px;border:1px solid rgba(255,255,255,.13);border-radius:6px;background:#101d2c;color:#e9eef5;font-size:12px;font-weight:700;cursor:pointer}
    .color-tool input{width:20px;height:20px;padding:0;border:0;background:transparent;cursor:pointer}
    .editor-body{min-height:620px;max-height:none;overflow:visible;padding:42px clamp(24px,6vw,78px);font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.85;outline:none;background:#07101d;color:#eef3f8}
    .editor-body:empty:before{content:attr(data-placeholder);color:#64758a;pointer-events:none}
    .editor-body p{margin:0 0 1.1em}.editor-body h1,.editor-body h2,.editor-body h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;color:#f1eadf}.editor-body blockquote{margin:1.2em 0;padding:8px 18px;border-left:3px solid #d39b28;color:#b7c1cf}.editor-body a{color:#f0bb43}.editor-body img{max-width:100%;height:auto}.editor-body ul,.editor-body ol{padding-left:1.7em}
    .editor-footer{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
    .status{min-height:20px;margin:0;color:#91a1b5;font-size:12px;line-height:1.5}.status.error{color:#e98b8b}.status.success{color:#8fd0a8}
    .actions{display:flex;gap:9px}.action{min-height:44px;padding:0 18px;border-radius:9px;font:800 12px/1 "DM Sans",sans-serif;cursor:pointer}.secondary{border:1px solid rgba(255,255,255,.12);background:transparent;color:#aab5c5}.primary{border:1px solid rgba(231,170,49,.6);background:var(--mi-gold);color:#111827}.action:disabled{opacity:.55;cursor:not-allowed}
    .draft-note{margin:12px 0 0;color:#657389;font-size:11px}
    @media(max-width:720px){.chapter-page{padding:100px 14px 50px}.chapter-top{align-items:flex-start;flex-direction:column}.chapter-top h1{font-size:34px}.chapter-meta{grid-template-columns:1fr}.chapter-panel{padding:17px}.editor-body{min-height:520px;padding:28px 20px;font-size:17px}.toolbar{position:sticky;top:78px;padding:8px;max-height:calc(100vh - 90px);overflow:auto}.tool,.toolbar select,.color-tool{height:36px}.editor-footer{align-items:stretch;flex-direction:column}.actions{width:100%}.action{flex:1}}
  .toolbar #fontFamily option{font-size:14px}.toolbar #fontFamily optgroup{font-family:"DM Sans",Arial,sans-serif;font-weight:700}.toolbar #fontFamily option[value="Georgia"]{font-family:Georgia,serif}.toolbar #fontFamily option[value="Times New Roman"]{font-family:"Times New Roman",serif}.toolbar #fontFamily option[value="EB Garamond"]{font-family:"EB Garamond",serif}.toolbar #fontFamily option[value="Cormorant Garamond"]{font-family:"Cormorant Garamond",serif}.toolbar #fontFamily option[value="Libre Baskerville"]{font-family:"Libre Baskerville",serif}.toolbar #fontFamily option[value="Lora"]{font-family:Lora,serif}.toolbar #fontFamily option[value="Merriweather"]{font-family:Merriweather,serif}.toolbar #fontFamily option[value="Playfair Display"]{font-family:"Playfair Display",serif}.toolbar #fontFamily option[value="Roboto Slab"]{font-family:"Roboto Slab",serif}.toolbar #fontFamily option[value="Source Serif 4"]{font-family:"Source Serif 4",serif}.toolbar #fontFamily option[value="Inter"]{font-family:Inter,sans-serif}.toolbar #fontFamily option[value="Poppins"]{font-family:Poppins,sans-serif}.toolbar #fontFamily option[value="Montserrat"]{font-family:Montserrat,sans-serif}.toolbar #fontFamily option[value="Nunito"]{font-family:Nunito,sans-serif}.toolbar #fontFamily option[value="Quicksand"]{font-family:Quicksand,sans-serif}.toolbar #fontFamily option[value="Raleway"]{font-family:Raleway,sans-serif}.toolbar #fontFamily option[value="Archivo"]{font-family:Archivo,sans-serif}.toolbar #fontFamily option[value="Oswald"]{font-family:Oswald,sans-serif}.toolbar #fontFamily option[value="Cinzel"]{font-family:Cinzel,serif}.toolbar #fontFamily option[value="Caveat"]{font-family:Caveat,cursive}.toolbar #fontFamily option[value="Comic Neue"]{font-family:"Comic Neue",cursive}.toolbar #fontFamily option[value="Comfortaa"]{font-family:Comfortaa,cursive}.toolbar #fontFamily option[value="Pacifico"]{font-family:Pacifico,cursive}.toolbar #fontFamily option[value="Arial"]{font-family:Arial,sans-serif}.toolbar #fontFamily option[value="Verdana"]{font-family:Verdana,sans-serif}.toolbar #fontFamily option[value="Trebuchet MS"]{font-family:"Trebuchet MS",sans-serif}.toolbar #fontFamily option[value="Courier New"]{font-family:"Courier New",monospace}
    </style>
</head>
<body>
  <main class="chapter-page">
    <div class="chapter-shell">
      <div class="chapter-top">
        <div>
          <p class="chapter-kicker">MeteorInk Author Studio</p>
          <h1>Add a new chapter.</h1>
          <p class="chapter-subtitle" id="novelSubtitle">Loading your novel…</p>
        </div>
        <a class="chapter-back" id="backButton" href="author-dashboard.html">← Back to Dashboard</a>
      </div>

      <section class="chapter-panel" aria-labelledby="chapterTitlePage">
        <div class="chapter-meta">
          <div class="field">
            <label for="chapterNumber">Chapter Number</label>
            <input id="chapterNumber" type="number" min="1" max="1000000" step="1" required>
            <p class="field-help">The next available number is suggested automatically.</p>
          </div>
          <div class="field">
            <label for="chapterTitle">Chapter Title</label>
            <input id="chapterTitle" type="text" maxlength="200" placeholder="Enter your chapter title" required>
          </div>
        </div>

        <div class="editor-label">
          <label for="chapterEditor">Chapter Content</label>
          <span class="counts" id="counts">0 words · 0 characters</span>
        </div>

        <div class="editor" id="editorWrap">
          <div class="toolbar" role="toolbar" aria-label="Chapter formatting">
            <button class="tool" type="button" data-cmd="bold" title="Bold"><strong>B</strong></button>
            <button class="tool" type="button" data-cmd="italic" title="Italic"><em>I</em></button>
            <button class="tool" type="button" data-cmd="underline" title="Underline"><u>U</u></button>
            <button class="tool" type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
            <span class="separator"></span>
            <select id="blockStyle" aria-label="Text style">
              <option value="P">Normal</option><option value="H1">Heading 1</option><option value="H2">Heading 2</option><option value="H3">Heading 3</option><option value="BLOCKQUOTE">Quote</option>
            </select>
            <select id="fontFamily" aria-label="Font family" title="Font family">
              <optgroup label="Classic & Formal">
                <option value="Georgia" style="font-family: 'Georgia', sans-serif;">Georgia</option>
                <option value="Times New Roman" style="font-family: 'Times New Roman', sans-serif;">Times New Roman</option>
                <option value="EB Garamond" style="font-family: 'EB Garamond', sans-serif;">EB Garamond</option>
                <option value="Cormorant Garamond" style="font-family: 'Cormorant Garamond', sans-serif;">Cormorant Garamond</option>
                <option value="Libre Baskerville" style="font-family: 'Libre Baskerville', sans-serif;">Libre Baskerville</option>
                <option value="Lora" style="font-family: 'Lora', sans-serif;">Lora</option>
                <option value="Merriweather" style="font-family: 'Merriweather', sans-serif;">Merriweather</option>
                <option value="Playfair Display" style="font-family: 'Playfair Display', sans-serif;">Playfair Display</option>
                <option value="Roboto Slab" style="font-family: 'Roboto Slab', sans-serif;">Roboto Slab</option>
                <option value="Source Serif 4" style="font-family: 'Source Serif 4', sans-serif;">Source Serif 4</option>
              </optgroup>
              <optgroup label="Modern & Clean">
                <option value="Inter" style="font-family: 'Inter', sans-serif;">Inter</option>
                <option value="Poppins" style="font-family: 'Poppins', sans-serif;">Poppins</option>
                <option value="Montserrat" style="font-family: 'Montserrat', sans-serif;">Montserrat</option>
                <option value="Nunito" style="font-family: 'Nunito', sans-serif;">Nunito</option>
                <option value="Quicksand" style="font-family: 'Quicksand', sans-serif;">Quicksand</option>
                <option value="Raleway" style="font-family: 'Raleway', sans-serif;">Raleway</option>
                <option value="Archivo" style="font-family: 'Archivo', sans-serif;">Archivo</option>
                <option value="Oswald" style="font-family: 'Oswald', sans-serif;">Oswald</option>
              </optgroup>
              <optgroup label="Stylish & Creative">
                <option value="Cinzel" style="font-family: 'Cinzel', sans-serif;">Cinzel</option>
                <option value="Caveat" style="font-family: 'Caveat', sans-serif;">Caveat</option>
                <option value="Comic Neue" style="font-family: 'Comic Neue', sans-serif;">Comic Neue</option>
                <option value="Comfortaa" style="font-family: 'Comfortaa', sans-serif;">Comfortaa</option>
                <option value="Pacifico" style="font-family: 'Pacifico', sans-serif;">Pacifico</option>
                <option value="Arial" style="font-family: 'Arial', sans-serif;">Arial</option>
                <option value="Verdana" style="font-family: 'Verdana', sans-serif;">Verdana</option>
                <option value="Trebuchet MS" style="font-family: 'Trebuchet MS', sans-serif;">Trebuchet MS</option>
                <option value="Courier New" style="font-family: 'Courier New', sans-serif;">Courier New</option>
              </optgroup>
            </select>
            <select id="fontSize" aria-label="Font size" title="Font size">
              <option value="1">12 px</option>
              <option value="2">14 px</option>
              <option value="3" selected>16 px</option>
              <option value="4">18 px</option>
              <option value="5">22 px</option>
              <option value="6">26 px</option>
              <option value="7">32 px</option>
            </select>
            <span class="separator"></span>
            <button class="tool" type="button" data-cmd="justifyLeft" title="Align left">≡</button>
            <button class="tool" type="button" data-cmd="justifyCenter" title="Center">☰</button>
            <button class="tool" type="button" data-cmd="justifyRight" title="Align right">≡</button>
            <button class="tool" type="button" data-cmd="justifyFull" title="Justify">▤</button>
            <span class="separator"></span>
            <button class="tool" type="button" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
            <button class="tool" type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
            <button class="tool" type="button" data-cmd="outdent" title="Outdent">←</button>
            <button class="tool" type="button" data-cmd="indent" title="Indent">→</button>
            <button class="tool" type="button" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="Quote">❝</button>
            <span class="separator"></span>
            <label class="color-tool" title="Text color">A <input id="textColor" type="color" value="#20242a" aria-label="Text color"></label>
            <label class="color-tool" title="Highlight color">▰ <input id="highlightColor" type="color" value="#fff2a8" aria-label="Highlight color"></label>
            <button class="tool" type="button" data-cmd="removeFormat" title="Clear formatting">Tx</button>
            <button class="tool" type="button" id="undoButton" title="Undo">↶</button>
            <button class="tool" type="button" id="redoButton" title="Redo">↷</button>
          </div>
          <div id="chapterEditor" class="editor-body" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Start writing your chapter…"></div>
        </div>
        <p class="draft-note">Drafts are saved locally while you write. Publishing sends the formatted chapter to MeteorInk.</p>

        <div class="editor-footer">
          <p class="status" id="status" aria-live="polite"></p>
          <div class="actions">
            <button class="action secondary" type="button" id="saveDraftButton">Save Draft</button>
            <button class="action secondary" type="button" id="cancelButton">Cancel</button>
            <button class="action primary" type="button" id="publishButton">Publish Chapter</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  (()=>{
    'use strict';
    const $=id=>document.getElementById(id);
    const params=new URLSearchParams(location.search);
    const novelId=String(params.get('novel')||'').trim();
    const editor=$('chapterEditor'), numberInput=$('chapterNumber'), titleInput=$('chapterTitle'), status=$('status'), publish=$('publishButton'), draft=$('saveDraftButton');
    const subtitle=$('novelSubtitle'), back=$('backButton'), counts=$('counts');
    const draftKey=novelId?`meteorink_chapter_draft_${novelId}`:'';
    let novel=null;
    try{document.execCommand('styleWithCSS',false,true)}catch{}

    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const setStatus=(msg,type='')=>{status.textContent=msg;status.className=`status${type?' '+type:''}`};
    const plain=()=>editor.innerText.replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    const updateCounts=()=>{const t=plain();const words=t?t.split(/\s+/).length:0;counts.textContent=`${words.toLocaleString()} words · ${t.length.toLocaleString()} characters`};

    function sanitize(html){
      const doc=new DOMParser().parseFromString(`<div>${html||''}</div>`,'text/html');
      const allowed=new Set(['DIV','P','BR','STRONG','B','EM','I','U','S','STRIKE','SPAN','H1','H2','H3','BLOCKQUOTE','UL','OL','LI','A','SUB','SUP','FONT']);
      const walk=node=>{
        [...node.children].forEach(el=>{
          if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return walk(node)}
          [...el.attributes].forEach(a=>{
            if(a.name.startsWith('on')||a.name==='id'||a.name==='class'||a.name==='srcdoc')el.removeAttribute(a.name);
          });
          if(el.tagName==='A'){const href=el.getAttribute('href')||'';if(!/^(https?:|mailto:)/i.test(href)){el.removeAttribute('href')}else{el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}}
          if(el.hasAttribute('style')){
            const styles=[];for(const prop of ['font-family','font-size','color','background-color','text-align','font-weight','font-style','text-decoration']){const v=el.style.getPropertyValue(prop);if(v)styles.push(`${prop}:${v}`)}
            if(styles.length)el.setAttribute('style',styles.join(';'));else el.removeAttribute('style');
          }
          walk(el);
        });
      };
      walk(doc.body.firstElementChild);return doc.body.firstElementChild?.innerHTML||'';
    }

    let savedRange=null;
    editor.addEventListener('mouseup',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()});
    editor.addEventListener('keyup',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()});
    function restoreSelection(){if(!savedRange)return;try{const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange)}catch{}}
    function exec(cmd,value=null){editor.focus();restoreSelection();try{document.execCommand(cmd,false,value)}catch{};updateCounts();}
    document.querySelectorAll('[data-cmd]').forEach(btn=>btn.addEventListener('mousedown',e=>{e.preventDefault();const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()}));
    document.querySelectorAll('[data-cmd]').forEach(btn=>btn.addEventListener('click',()=>exec(btn.dataset.cmd,btn.dataset.value||null)));
    $('undoButton').addEventListener('click',()=>exec('undo'));$('redoButton').addEventListener('click',()=>exec('redo'));
    $('blockStyle').addEventListener('mousedown',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()});
    $('blockStyle').addEventListener('change',e=>exec('formatBlock',e.target.value));
    $('fontFamily').addEventListener('mousedown',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()});
    $('fontFamily').addEventListener('change',e=>exec('fontName',e.target.value));
    $('fontSize').addEventListener('mousedown',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange()});
    $('fontSize').addEventListener('change',e=>exec('fontSize',e.target.value));
    $('textColor').addEventListener('input',e=>exec('foreColor',e.target.value));
    $('highlightColor').addEventListener('input',e=>exec('hiliteColor',e.target.value));
    editor.addEventListener('input',()=>{updateCounts();setStatus('');});
    editor.addEventListener('paste',e=>{e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,text);updateCounts();});

    function saveDraft(){if(!draftKey)return;localStorage.setItem(draftKey,JSON.stringify({number:numberInput.value,title:titleInput.value,content:editor.innerHTML,savedAt:new Date().toISOString()}));setStatus('Draft saved on this device.','success')}
    function restoreDraft(){if(!draftKey)return false;try{const d=JSON.parse(localStorage.getItem(draftKey)||'null');if(!d)return false;if(d.number)numberInput.value=d.number;if(d.title)titleInput.value=d.title;if(d.content)editor.innerHTML=sanitize(d.content);setStatus('Restored your local draft.');updateCounts();return true}catch{return false}}

    async function load(){
      if(!novelId||!/^[0-9a-f-]{36}$/i.test(novelId)){setStatus('This chapter link is invalid.','error');publish.disabled=true;return}
      try{
        const ar=await fetch('/api/author/me',{credentials:'same-origin',headers:{Accept:'application/json'},cache:'no-store'});if(!ar.ok){location.href='auth.html?next=writer';return}
        const ad=await ar.json();if(!ad.author){location.href='author-setup.html';return}
        const nr=await fetch('/api/author/me/novels',{credentials:'same-origin',headers:{Accept:'application/json'},cache:'no-store'});const nd=await nr.json().catch(()=>({}));
        novel=(nd.novels||[]).find(n=>String(n.id)===novelId);if(!novel){setStatus('Novel not found or you do not have access to it.','error');publish.disabled=true;return}
        subtitle.textContent=`Writing for “${novel.title||'Untitled Novel'}”`;
        try{back.href=`author-dashboard.html`;}catch{}
        const cr=await fetch(`/api/novels/${encodeURIComponent(novelId)}/chapters`,{credentials:'same-origin',headers:{Accept:'application/json'},cache:'no-store'});const cd=await cr.json().catch(()=>({}));
        const chapters=Array.isArray(cd.chapters)?cd.chapters:[];const next=chapters.reduce((m,c)=>Math.max(m,Number(c.chapterNumber||c.chapter_number||0)),0)+1;numberInput.value=next;
        restoreDraft();if(!numberInput.value)numberInput.value=next;
        titleInput.focus();
      }catch(err){setStatus(err.message||'Unable to load the chapter editor.','error');publish.disabled=true}
    }

    publish.addEventListener('click',async()=>{
      const number=Math.floor(Number(numberInput.value));const title=titleInput.value.trim();const content=sanitize(editor.innerHTML).trim();
      if(!Number.isInteger(number)||number<1){setStatus('Enter a valid chapter number.','error');numberInput.focus();return}
      if(!title||title.length>200){setStatus('Enter a chapter title up to 200 characters.','error');titleInput.focus();return}
      if(!plain()){setStatus('Chapter content cannot be empty.','error');editor.focus();return}
      publish.disabled=true;draft.disabled=true;$('cancelButton').disabled=true;publish.textContent='Publishing…';setStatus('Publishing chapter…');
      try{
        const r=await fetch(`/api/novels/${encodeURIComponent(novelId)}/chapters`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({chapterNumber:number,title,content}),cache:'no-store'});
        const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||`Unable to publish chapter (${r.status}).`);
        if(draftKey)localStorage.removeItem(draftKey);setStatus(`Chapter ${number} published successfully.`,'success');publish.textContent='Published';
        setTimeout(()=>location.href='author-dashboard.html',700);
      }catch(err){setStatus(err.message||'Unable to publish chapter.','error');publish.disabled=false;draft.disabled=false;$('cancelButton').disabled=false;publish.textContent='Publish Chapter'}
    });
    draft.addEventListener('click',saveDraft);
    $('cancelButton').addEventListener('click',()=>{location.href='author-dashboard.html'});
    window.addEventListener('beforeunload',()=>{if(plain())try{localStorage.setItem(draftKey,JSON.stringify({number:numberInput.value,title:titleInput.value,content:editor.innerHTML,savedAt:new Date().toISOString()}))}catch{}});
    load();
  })();
  </script>
  <script src="meteorink-app.js"></script>
</body>
</html>
