<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Sign Up</title><link rel="stylesheet" href="styles.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWX483HZEH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MWX483HZEH');
  </script>

</head>
<body class="auth-no-global-nav">
<main class="auth-split-page signup-split-page">
  <section class="auth-form-side"><section class="flow-card signup-card"><h1>Create Account</h1><p>Join MeteorInk and start your journey.</p>
    <div class="social-signup"><button type="button" class="social-btn" id="googleSignup">Sign Up with Google</button></div>

    <div id="signupManualRemoved" class="auth-note">Account creation is available through Google.</div>
    <p class="auth-switch"><a href="auth.html">Already have an account? Log In</a></p>
  </section></section>
  <section class="auth-scenery" aria-label="MeteorInk signup scenery"><a class="auth-brand-mark" href="index.html"><img src="assets/logo.jpg" alt="MeteorInk logo"></a><div class="auth-scenery-copy"><p class="section-kicker">BEGIN YOUR JOURNEY</p><h2>Create worlds.<br>Share stories.</h2><p>Build your presence on MeteorInk and become part of a growing universe of stories.</p></div></section>
</main>
<script>
document.getElementById('googleSignup').onclick=()=>{const next=new URLSearchParams(location.search).get('next');location.href='/auth/google'+(next==='writer'?'?next=writer':'');};
</script><script>
(async function(){
  if(!new URLSearchParams(location.search).has('googleComplete')) return;
  try {
    const r=await fetch('/api/me',{credentials:'same-origin'});
    const data=await r.json();
    if(!data.authenticated || !data.user) return;
    const social=document.querySelector('.social-signup');
    const note=document.getElementById('signupManualRemoved');
    if(social) social.hidden=true;
    if(note) note.hidden=true;
    const panel=document.createElement('div');
    panel.className='flow-card google-complete-card';
    panel.innerHTML=`
      <h2>Complete your account</h2>
      <p>Google verified your email. Add your date of birth to finish creating your MeteorInk account.</p>
      <label>Your Name <span class="required">*</span></label>
      <input id="googleName" type="text" required>
      <label>Surname <span class="optional">(optional)</span></label>
      <input id="googleSurname" type="text">
      <label>Date of Birth <span class="required">*</span></label>
      <input id="googleDob" type="date" required>
      <p class="auth-note">Standard MeteorInk accounts currently require users to be 18+.</p>
      <p id="googleCompleteError" class="auth-error" hidden></p>
      <button id="googleCompleteSubmit" type="button" class="gold-btn">Finish Account</button>`;
    const host=document.querySelector('.signup-card');
    host.appendChild(panel);
    document.getElementById('googleName').value=data.user.name||'';
    document.getElementById('googleSurname').value=data.user.surname||'';
    const d=document.getElementById('googleDob');
    const now=new Date(); d.max=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString().slice(0,10);
    document.getElementById('googleCompleteSubmit').onclick=async()=>{
      const err=document.getElementById('googleCompleteError');err.hidden=true;
      const res=await fetch('/api/google/complete-profile',{
        method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
        body:JSON.stringify({name:document.getElementById('googleName').value.trim(),surname:document.getElementById('googleSurname').value.trim(),dob:d.value,next:new URLSearchParams(location.search).get('next')})
      });
      const out=await res.json();
      if(!res.ok){err.textContent=out.error||'Could not complete your account.';err.hidden=false;return;}
      const next=new URLSearchParams(location.search).get('next');location.href=next==='writer'?'index.html?oauth=success&next=writer':'index.html?oauth=success';
    };
  } catch(e) {
    console.warn('Google account completion is available when MeteorInk is running through the local server.');
  }
})();
</script><script src="meteorink-app.js"></script></body></html>
