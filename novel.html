<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MeteorInk — Novel</title><link rel="stylesheet" href="styles.css"><style>.novel-page{min-height:100vh;padding:130px 5vw 80px;background:#030711}.novel-shell{max-width:1050px;margin:auto}.novel-hero{display:grid;grid-template-columns:260px 1fr;gap:30px;background:rgba(7,14,25,.88);border:1px solid rgba(231,170,49,.2);border-radius:16px;padding:26px}.novel-cover{min-height:350px;border-radius:12px;background:linear-gradient(145deg,#14263c,#050a12);display:grid;place-items:center;overflow:hidden;color:#e7aa31;font-size:42px}.novel-cover img{width:100%;height:100%;object-fit:cover}.novel-page h1{font-family:var(--serif);font-size:50px;margin:8px 0}.novel-meta{color:#9faabd}.novel-description{line-height:1.8;color:#c5cedb}.reader-btn{margin-top:18px}.chapter-list{margin-top:22px;display:grid;gap:8px}.chapter{padding:15px;border:1px solid rgba(255,255,255,.07);border-radius:9px;color:#dce4ed;text-decoration:none;background:rgba(255,255,255,.025)}.chapter:hover{border-color:rgba(231,170,49,.35)}@media(max-width:750px){.novel-hero{grid-template-columns:1fr}.novel-cover{min-height:280px}.novel-page h1{font-size:38px}}</style></head><body><main class="novel-page"><div class="novel-shell" id="novelRoot"></div></main><script src="meteorink-data.js"></script><script>const id=new URLSearchParams(location.search).get('id'),n=(MeteorInkData.getCatalogNovels?MeteorInkData.getCatalogNovels():MeteorInkData.getNovels()).find(x=>x.id===id),root=document.getElementById('novelRoot');if(!n){root.innerHTML='<section class="flow-card"><h1>Novel not found</h1><p>This story does not exist in the current library.</p><a class="gold-btn" href="index.html">Back to Home</a></section>';}else{MeteorInkData.recordRead(n.id);MeteorInkData.recordView(n.id);root.innerHTML=`<section class="novel-hero"><div class="novel-cover">${n.cover?`<img src="${n.cover}" alt="${n.title} cover">`:'✦'}</div><div><p class="section-kicker">${n.genre||'NOVEL'}</p><h1>${n.title}</h1><p class="novel-meta">by ${n.authorName||'Unknown Author'}${MeteorInkData.isAuthorVerified&&MeteorInkData.isAuthorVerified(n.authorId,n.authorName)?`<img class="novel-showcase-verified" src="${MeteorInkData.verificationBadgeAsset(n.authorId,n.authorName)}" alt="Verified Author" title="Verified Author">`:''} · ${Number(n.views||0).toLocaleString()} views</p><p class="novel-description">${n.description||'No description has been added yet.'}</p><a class="gold-btn reader-btn" href="reader.html?id=${encodeURIComponent(n.id)}">Start Reading</a></div></section>`;}</script><script src="meteorink-app.js"></script></body></html>
