<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="assets/meteorink-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | MeteorInk</title>
<link rel="stylesheet" href="styles.css">
<style>
.search-page{min-height:100vh;padding:130px 5vw 80px;background:#030711;color:#fff}.search-page h1{font-family:"Cormorant Garamond",serif;font-size:48px;margin:0 0 8px}.search-sub{color:#aeb6c7;margin-bottom:28px}.search-form{display:flex;gap:10px;max-width:850px}.search-form input{flex:1;background:#08101d;border:1px solid rgba(231,170,49,.45);color:#fff;padding:15px 18px;border-radius:8px;font-size:16px}.search-form button{border:0;border-radius:8px;padding:0 24px;background:#e7aa31;color:#080b12;font-weight:700;cursor:pointer}.results{max-width:1000px;margin-top:40px}.result{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.1)}.result h3{margin:0 0 6px}.result p{margin:0;color:#aeb6c7}.empty{padding:42px 0;color:#aeb6c7}.asset-pagination-wrap{margin-top:20px}.asset-pagination{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.asset-pagination button{min-width:40px;height:40px;border:1px solid rgba(231,170,49,.22);border-radius:9px;background:#08101d;color:#cfd7e2;font-weight:700;cursor:pointer}.asset-pagination button.active{background:#e7aa31;color:#090d14}.asset-pagination button:disabled{opacity:.45}.asset-pagination span{color:#8b98aa;font-size:12px;margin:0 6px}.back{display:inline-block;margin-top:25px;color:#e7aa31;text-decoration:none}
</style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWX483HZEH"></script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

</head>
<body>
<header class="site-header">
<a class="brand" href="index.html"><span>Meteor<i>Ink</i><small>Stories. Worlds. Beyond.</small></span></a>
<div class="header-actions"><a class="text-btn" href="auth.html">Log In</a><a class="gold-btn small" href="signup.html">Sign Up</a></div>
</header>
<main class="search-page">
<p class="section-kicker">DISCOVER</p><h1>Search MeteorInk</h1><p class="search-sub">Find novels and authors across the platform.</p>
<form class="search-form" id="searchForm"><input id="query" type="search" placeholder="Search novels, authors,......." autocomplete="off"><button>Search</button></form>
<section class="results" id="results"></section><a class="back" href="index.html">← Back to Home</a>
</main>
<script src="meteorink-data.js"></script><script>(async function(){const q=document.getElementById('query'),results=document.getElementById('results'),form=document.getElementById('searchForm'),params=new URLSearchParams(location.search);q.value=params.get('q')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localNovels(term){return MeteorInkData.getNovels().filter(n=>[n.title,n.genre,n.description,n.authorName].filter(Boolean).some(v=>String(v).toLowerCase().includes(term))).map(n=>({...n,type:'Novel',label:n.title||'Untitled Novel',popularity:Number(n.views||0)}));}async function remoteAuthors(term){try{const r=await fetch('/api/authors?q='+encodeURIComponent(term),{credentials:'same-origin'});if(!r.ok)return[];const d=await r.json();return(d.authors||[]).map(a=>({...a,type:'Author',label:a.name||'Unnamed Author',popularity:Number(a.followers||0)}));}catch{return[];}}async function render(){const term=q.value.trim().toLowerCase();results.innerHTML='';if(!term){results.innerHTML='<div class="empty">Enter a novel title, author name, or @UserID to search.</div>';return;}const authors=await remoteAuthors(term.replace(/^@/,''));const matches=[...authors,...localNovels(term)].sort((a,b)=>b.popularity-a.popularity);if(!matches.length){results.innerHTML='<div class="empty"><strong class="not-in-existence">Not In Existence</strong><br>No matching content exists on MeteorInk for this keyword.</div>';return;}const perPage=20;let page=Number(window.__searchPage||1),totalPages=Math.max(1,Math.ceil(matches.length/perPage));page=Math.min(page,totalPages);window.__searchPage=page;const pageItems=matches.slice((page-1)*perPage,page*perPage);results.innerHTML=pageItems.map(x=>x.type==='Author'?`<article class="result"><h3><a href="author-profile.html?id=${encodeURIComponent(x.id)}" style="color:inherit;text-decoration:none">${esc(x.label)}</a></h3><p>Author · @${esc(x.username||'')} · ${Number(x.followers||0).toLocaleString()} followers</p></article>`:`<article class="result"><h3>${esc(x.label)}</h3><p>Novel · ${Number(x.views||0).toLocaleString()} views${x.genre?' · '+esc(x.genre):''}</p></article>`).join('');if(totalPages>1){let pg=document.createElement('div');pg.className='asset-pagination-wrap';let h='<nav class="asset-pagination"><button data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>Previous</button>';for(let i=Math.max(1,Math.min(page-3,totalPages-6));i<=Math.min(totalPages,Math.max(1,Math.min(page-3,totalPages-6))+6);i++)h+='<button data-page="'+i+'" class="'+(i===page?'active':'')+'">'+i+'</button>';h+='<span>Page '+page+' of '+totalPages+'</span><button data-page="'+(page+1)+'" '+(page===totalPages?'disabled':'')+'>Next</button></nav>';pg.innerHTML=h;results.appendChild(pg);pg.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;window.__searchPage=Number(b.dataset.page);render();window.scrollTo({top:0,behavior:'smooth'});}));}}form.addEventListener('submit',e=>{e.preventDefault();window.__searchPage=1;history.replaceState({},'',q.value.trim()?'search.html?q='+encodeURIComponent(q.value.trim()):'search.html');render()});render();})();</script>
</body></html>
